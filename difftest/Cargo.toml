[package]
name = "difftest"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "difftest"
path = "src/lib.rs"

[[bin]]
name = "difftest"
path = "src/bin/difftest.rs"

[dependencies]
ergotree-ir = "0.28"
ergotree-interpreter = { version = "0.28", features = ["arbitrary"] }
ergo-chain-types = { version = "0.15", features = ["arbitrary"] }
sigma-test-util = "0.3"
sigma-ser = "0.19"
bounded-vec = "0.7"
num-bigint = "0.4"
indexmap = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
