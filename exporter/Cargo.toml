[package]
name = "exporter"
version = "0.1.0"
edition = "2021"
publish = false
license = "CC0-1.0"
repository = "https://github.com/cruxfinance/ergotree-lean"

[[bin]]
name = "exporter"
path = "src/main.rs"

[dependencies]
ergotree-ir = "0.28"
ergo-chain-types = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hex = "0.4"
